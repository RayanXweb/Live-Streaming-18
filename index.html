<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streaming 18+</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  html, body { width:100%; height:100%; overflow:hidden; }

  body {
    background: radial-gradient(circle, #2c003e, #ff004f);
    display:flex; justify-content:center; align-items:center; flex-direction:column;
    color:#fff; text-align:center; position:relative;
  }

  /* Header image bulat */
  #headerImg {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #fff;
    object-fit: cover;
    margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
  }

  h1 { font-size:3rem; text-shadow:0 0 15px rgba(255,255,255,0.5); margin-bottom:30px; }

  #countdownContainer {
    position: relative;
    width: 250px;
    height: 250px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom: 40px;
  }

  #countdownText {
    font-size:3rem;
    z-index: 1;
  }

  #startButton {
    padding: 15px 40px;
    font-size:1.5rem;
    color:#fff;
    background:#ff004f;
    border:none; border-radius:15px;
    cursor:not-allowed;
    opacity: 0.5;
    text-transform:uppercase; letter-spacing:1px;
    transition: all 0.3s ease;
  }

  #startButton.active {
    cursor:pointer;
    opacity: 1;
    background:#ff004f;
  }

  #startButton.active:hover { background:#ff66a3; transform:scale(1.1); }

  body::before {
    content:'';
    position:absolute; width:200%; height:200%;
    top:-50%; left:-50%;
    background: radial-gradient(circle, rgba(255,0,79,0.3), rgba(44,0,62,0.5));
    animation: rotate 25s linear infinite;
    z-index:0;
  }

  @keyframes rotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
  <div class="content">
    <img id="headerImg" src="https://image2url.com/r2/default/images/1774878342365-27c9eb26-387c-422c-a676-a8e367381b3b.png" alt="Header Image">
    <h1>Live Streaming 18+</h1>
    <div id="countdownContainer">
      <div id="countdownText">60:00</div>
    </div>
    <button id="startButton">Mulai Live</button>
  </div>

<script>
  // BLOCK HOME / BACK BROWSER
  history.pushState(null, null, location.href);
  window.onpopstate = function () { history.go(1); };

  // TIMER 60 MENIT
  const totalSeconds = 60 * 60;
  let remainingSeconds = totalSeconds;
  const countdownText = document.getElementById('countdownText');
  const startButton = document.getElementById('startButton');

  function updateCountdown(){
    let minutes = Math.floor(remainingSeconds/60);
    let seconds = remainingSeconds % 60;
    countdownText.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    
    if(remainingSeconds > 0){
      remainingSeconds--;
    } else {
      clearInterval(timer);
      countdownText.textContent = "LIVE!";
      // Aktifkan tombol setelah timer habis
      startButton.disabled = false;
      startButton.classList.add('active');
      startButton.style.cursor = 'pointer';
    }
  }

  const timer = setInterval(updateCountdown,1000);

  startButton.addEventListener('click', () => {
    if (!startButton.classList.contains('active')) return;
    alert("Live streaming dimulai! (Simulasi)");
    // window.location.href = "https://link-live-streaming.com";
  });

  // Pastikan tombol tidak aktif sebelum waktunya
  startButton.disabled = true;
</script>
</body>
</html>
